<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Currency Converter</title>

  <link rel="manifest" href="manifest.json" />

  <meta name="theme-color" content="#11151b" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Currency" />

  <link rel="apple-touch-icon" href="icon-180.png" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="page">
    <header class="header">
      <h1 id="page-title"></h1>
      <p>Type in any box and the others update.</p>
    </header>

    <section id="converter" class="converter"></section>

    <section id="rates" class="rates"></section>

    <div id="status" class="status">
      Loading currency data...
    </div>
  </main>

  <script>
    const config = {
      baseCurrency: "USD",

      convertedCurrencies: [
        "SGD",
        "AUD",
        "MYR",
        "INR",
        "IDR",
        "EUR",
        "CAD",
        "PHP",
        "BRL"
      ]
    };

    const currencies = [
      config.baseCurrency,
      ...config.convertedCurrencies
    ];

    const inputs = {};

    const rates = {
      [config.baseCurrency]: 1
    };

    const currencyNames = {};

    const RATE_CACHE_KEY =
      "currency-converter-rates";

    const NAME_CACHE_KEY =
      "currency-converter-names";


    const converterElement =
      document.getElementById("converter");

    const ratesElement =
      document.getElementById("rates");

    const statusElement =
      document.getElementById("status");

    const pageTitleElement =
      document.getElementById("page-title");


    function hashString (value) {
      let hash = 0;

      for (let i = 0; i < value.length; i++) {
        hash =
          value.charCodeAt(i) +
          ((hash << 5) - hash);

        hash |= 0;
      }

      return Math.abs(hash);
    }


    function getAccentColor (currency) {
      const hash =
        hashString(currency);

      const hue =
        hash % 360;

      return `hsl(${ hue } 72% 64%)`;
    }


    function getCurrencyName (currency) {
      return (
        currencyNames[currency] ??
        currency
      );
    }


    function formatAmount (value) {
      if (!Number.isFinite(value)) {
        return "";
      }

      if (Math.abs(value) >= 1000) {
        return Number(
          value.toFixed(0)
        );
      }

      return Number(
        value.toFixed(2)
      );
    }


    function formatRate (value) {
      if (value >= 1) {
        return value.toFixed(2);
      }

      if (value >= 0.01) {
        return value.toFixed(4);
      }

      return value.toFixed(6);
    }


    function renderTitle () {
      pageTitleElement.textContent =
        "Currency converter";
    }


    function renderCurrencyCards () {
      converterElement.innerHTML = "";

      currencies.forEach(currency => {
        const card =
          document.createElement("div");

        card.className =
          "currency-card";

        card.style.setProperty(
          "--accent",
          getAccentColor(currency)
        );

        card.innerHTML = `
        <div class="amount-wrap">
          <input
            id="currency-${ currency }"
            class="amount-input"
            type="number"
            inputmode="decimal"
            step="any"
            ${ currency === config.baseCurrency ? 'value="1"' : "" }
          />
        </div>

        <div class="currency-info">
          <div class="currency-code">
            ${ currency }
          </div>

          <div class="currency-name">
            ${ getCurrencyName(currency) }
          </div>
        </div>
      `;

        converterElement.appendChild(card);

        inputs[currency] =
          card.querySelector(
            ".amount-input"
          );
      });
    }


    function renderRateSummary () {
      ratesElement.innerHTML = "";

      if (
        config.convertedCurrencies.length === 0
      ) {
        return;
      }

      const parts = [
        `1 ${ config.baseCurrency }`
      ];

      config.convertedCurrencies.forEach(
        currency => {
          parts.push(
            `${ formatRate(
              rates[currency]
            ) } ${ currency }`
          );
        }
      );

      const row =
        document.createElement("div");

      row.textContent =
        parts.join(" = ");

      ratesElement.appendChild(row);
    }


    function convert (sourceCurrency) {
      if (!rates[sourceCurrency]) {
        return;
      }

      const sourceValue =
        parseFloat(
          inputs[sourceCurrency].value
        );

      if (Number.isNaN(sourceValue)) {
        currencies.forEach(currency => {
          if (currency !== sourceCurrency) {
            inputs[currency].value = "";
          }
        });

        return;
      }

      const valueInBaseCurrency =
        sourceValue /
        rates[sourceCurrency];

      currencies.forEach(currency => {
        if (currency === sourceCurrency) {
          return;
        }

        if (!rates[currency]) {
          return;
        }

        inputs[currency].value =
          formatAmount(
            valueInBaseCurrency *
            rates[currency]
          );
      });
    }


    function attachInputListeners () {
      currencies.forEach(currency => {
        inputs[currency].addEventListener(
          "input",
          () => convert(currency)
        );
      });
    }


    function saveRatesToCache (
      rateData
    ) {
      localStorage.setItem(
        RATE_CACHE_KEY,
        JSON.stringify({
          savedAt:
            new Date().toISOString(),

          data:
            rateData
        })
      );
    }


    function loadRatesFromCache () {
      const cached =
        localStorage.getItem(
          RATE_CACHE_KEY
        );

      if (!cached) {
        return null;
      }

      try {
        return JSON.parse(cached);
      } catch {
        return null;
      }
    }


    function saveNamesToCache () {
      localStorage.setItem(
        NAME_CACHE_KEY,
        JSON.stringify(
          currencyNames
        )
      );
    }


    function loadNamesFromCache () {
      const cached =
        localStorage.getItem(
          NAME_CACHE_KEY
        );

      if (!cached) {
        return false;
      }

      try {
        Object.assign(
          currencyNames,
          JSON.parse(cached)
        );

        return true;
      } catch {
        return false;
      }
    }


    async function loadCurrencyNames () {
      const response =
        await fetch(
          "https://api.frankfurter.dev/v2/currencies"
        );

      if (!response.ok) {
        throw new Error(
          `Currencies HTTP ${ response.status }`
        );
      }

      const data =
        await response.json();

      data.forEach(currency => {
        currencyNames[
          currency.iso_code
        ] = currency.name;
      });

      saveNamesToCache();
    }


    async function loadExchangeRates () {
      const quotes =
        config.convertedCurrencies.join(",");

      const url =
        "https://api.frankfurter.dev/v2/rates" +
        `?base=${ config.baseCurrency }` +
        `&quotes=${ quotes }`;

      const response =
        await fetch(url);

      if (!response.ok) {
        throw new Error(
          `Rates HTTP ${ response.status }`
        );
      }

      const data =
        await response.json();

      data.forEach(item => {
        rates[item.quote] =
          item.rate;
      });

      saveRatesToCache(data);

      return data;
    }


    function applyCachedRates (
      cached
    ) {
      if (
        !cached ||
        !Array.isArray(cached.data)
      ) {
        return false;
      }

      cached.data.forEach(item => {
        rates[item.quote] =
          item.rate;
      });

      return true;
    }


    function getRateDate (
      rateData
    ) {
      return rateData?.[0]?.date;
    }


    function showOnlineStatus (
      rateData
    ) {
      const rateDate =
        getRateDate(rateData);

      statusElement.classList.remove(
        "error"
      );

      statusElement.textContent =
        rateDate
          ? `Reference rates for ${ rateDate }`
          : "Latest reference rates";
    }


    function showOfflineStatus (
      cached
    ) {
      statusElement.classList.remove(
        "error"
      );

      const rateDate =
        cached?.data?.[0]?.date;

      statusElement.textContent =
        rateDate
          ? `Offline · cached rates from ${ rateDate }`
          : "Offline · using cached rates";
    }


    async function refreshData () {
      try {
        const [
          ,
          rateData
        ] = await Promise.all([
          loadCurrencyNames(),
          loadExchangeRates()
        ]);

        renderCurrencyCards();

        attachInputListeners();

        convert(
          config.baseCurrency
        );

        renderRateSummary();

        showOnlineStatus(
          rateData
        );

      } catch (error) {
        console.error(error);

        const cachedRates =
          loadRatesFromCache();

        const hasCachedRates =
          applyCachedRates(
            cachedRates
          );

        loadNamesFromCache();

        renderCurrencyCards();

        attachInputListeners();

        if (hasCachedRates) {
          convert(
            config.baseCurrency
          );

          renderRateSummary();

          showOfflineStatus(
            cachedRates
          );
        } else {
          statusElement.classList.add(
            "error"
          );

          statusElement.textContent =
            "Unable to load exchange rates.";
        }
      }
    }


    async function initialise () {
      renderTitle();

      loadNamesFromCache();

      const cachedRates =
        loadRatesFromCache();

      if (
        applyCachedRates(
          cachedRates
        )
      ) {
        renderCurrencyCards();

        attachInputListeners();

        convert(
          config.baseCurrency
        );

        renderRateSummary();

        showOfflineStatus(
          cachedRates
        );
      }

      await refreshData();
    }


    window.addEventListener(
      "online",
      () => {
        refreshData();
      }
    );


    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register(
        "./service-worker.js"
      );
    }


    initialise();
  </script>
</body>

</html>
