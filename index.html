<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Currency Converter</title>

  <link rel="manifest" href="manifest.json" />

  <meta name="theme-color" content="#11151b" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Currency" />

  <link rel="apple-touch-icon" href="icon-180.png" />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #11151b;
      --panel: #1a2028;
      --panel-border: #303947;
      --text: #f2f5f9;
      --muted: #9ca6b5;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(circle at top left,
          rgba(255, 255, 255, 0.025),
          transparent 34%),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .page {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 64px 28px 56px;
    }

    .header {
      margin-bottom: 58px;
    }

    .header h1 {
      margin: 0;

      font-size: clamp(36px, 5vw, 54px);
      line-height: 1.05;
      letter-spacing: -1.8px;
      font-weight: 750;
    }

    .header p {
      margin: 20px 0 0;

      color: var(--muted);

      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1.45;
    }

    .converter {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .currency-card {
      position: relative;

      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;

      gap: 28px;

      min-height: 160px;
      padding: 30px 36px;

      background:
        linear-gradient(135deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0)),
        var(--panel);

      border: 1px solid var(--panel-border);
      border-radius: 20px;

      overflow: hidden;

      transition:
        transform 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease;
    }

    .currency-card::before {
      content: "";

      position: absolute;
      inset: 0 auto 0 0;

      width: 12px;

      background: var(--accent);

      border-radius: 20px 0 0 20px;
    }

    .currency-card:hover {
      transform: translateY(-2px);
      border-color: #3d4858;
    }

    .currency-card:focus-within {
      transform: translateY(-2px);

      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    .amount-wrap {
      min-width: 0;
    }

    .amount-input {
      width: 100%;
      min-width: 0;

      padding: 0;
      margin: 0;

      border: 0;
      outline: none;

      background: transparent;
      color: var(--text);

      font: inherit;
      font-size: clamp(42px, 7vw, 64px);
      font-weight: 650;
      letter-spacing: -1.5px;

      appearance: textfield;
    }

    .amount-input::-webkit-inner-spin-button,
    .amount-input::-webkit-outer-spin-button {
      margin: 0;
      appearance: none;
    }

    .currency-info {
      min-width: 210px;
      text-align: right;
    }

    .currency-code {
      margin: 0;

      color: var(--accent);

      font-size: clamp(28px, 4vw, 38px);
      line-height: 1;
      font-weight: 750;
      letter-spacing: -0.6px;
    }

    .currency-name {
      margin-top: 22px;

      color: var(--muted);

      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.3;
    }

    .rates {
      margin-top: 48px;

      display: flex;
      flex-direction: column;
      gap: 14px;

      color: var(--muted);

      font-size: clamp(18px, 2.4vw, 24px);
      line-height: 1.45;
    }

    .status {
      margin-top: 26px;

      color: #707b8a;
      font-size: 14px;
    }

    .status.error {
      color: #ff7b89;
    }

    @media (max-width: 700px) {
      .page {
        padding: 40px 18px;
      }

      .header {
        margin-bottom: 36px;
      }

      .currency-card {
        min-height: 135px;
        padding: 26px 24px 26px 30px;
        gap: 18px;
      }

      .currency-card::before {
        width: 8px;
      }

      .currency-info {
        min-width: 130px;
      }

      .currency-name {
        margin-top: 14px;
        font-size: 15px;
      }
    }

    @media (max-width: 520px) {
      .currency-card {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .currency-info {
        min-width: 0;
        text-align: left;
      }

      .currency-name {
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <h1 id="page-title"></h1>
      <p>Type in any box and the others update.</p>
    </header>

    <section id="converter" class="converter"></section>

    <section id="rates" class="rates"></section>

    <div id="status" class="status">
      Loading currency data...
    </div>
  </main>

  <script>
    const config = {
      baseCurrency: "USD",

      convertedCurrencies: [
        "SGD",
        "AUD",
        "MYR",
        "INR",
        "IDR",
        "EUR",
        "CAD",
        "PHP",
        "BRL"
      ]
    };

    const currencies = [
      config.baseCurrency,
      ...config.convertedCurrencies
    ];

    const inputs = {};

    const rates = {
      [config.baseCurrency]: 1
    };

    const currencyNames = {};

    const RATE_CACHE_KEY =
      "currency-converter-rates";

    const NAME_CACHE_KEY =
      "currency-converter-names";


    const converterElement =
      document.getElementById("converter");

    const ratesElement =
      document.getElementById("rates");

    const statusElement =
      document.getElementById("status");

    const pageTitleElement =
      document.getElementById("page-title");


    function hashString (value) {
      let hash = 0;

      for (let i = 0; i < value.length; i++) {
        hash =
          value.charCodeAt(i) +
          ((hash << 5) - hash);

        hash |= 0;
      }

      return Math.abs(hash);
    }


    function getAccentColor (currency) {
      const hash =
        hashString(currency);

      const hue =
        hash % 360;

      return `hsl(${ hue } 72% 64%)`;
    }


    function getCurrencyName (currency) {
      return (
        currencyNames[currency] ??
        currency
      );
    }


    function formatAmount (value) {
      if (!Number.isFinite(value)) {
        return "";
      }

      if (Math.abs(value) >= 1000) {
        return Number(
          value.toFixed(0)
        );
      }

      return Number(
        value.toFixed(2)
      );
    }


    function formatRate (value) {
      if (value >= 1) {
        return value.toFixed(2);
      }

      if (value >= 0.01) {
        return value.toFixed(4);
      }

      return value.toFixed(6);
    }


    function renderTitle () {
      pageTitleElement.textContent =
        "Currency converter";
    }


    function renderCurrencyCards () {
      converterElement.innerHTML = "";

      currencies.forEach(currency => {
        const card =
          document.createElement("div");

        card.className =
          "currency-card";

        card.style.setProperty(
          "--accent",
          getAccentColor(currency)
        );

        card.innerHTML = `
        <div class="amount-wrap">
          <input
            id="currency-${ currency }"
            class="amount-input"
            type="number"
            inputmode="decimal"
            step="any"
            ${ currency === config.baseCurrency ? 'value="1"' : "" }
          />
        </div>

        <div class="currency-info">
          <div class="currency-code">
            ${ currency }
          </div>

          <div class="currency-name">
            ${ getCurrencyName(currency) }
          </div>
        </div>
      `;

        converterElement.appendChild(card);

        inputs[currency] =
          card.querySelector(
            ".amount-input"
          );
      });
    }


    function renderRateSummary () {
      ratesElement.innerHTML = "";

      if (
        config.convertedCurrencies.length === 0
      ) {
        return;
      }

      const parts = [
        `1 ${ config.baseCurrency }`
      ];

      config.convertedCurrencies.forEach(
        currency => {
          parts.push(
            `${ formatRate(
              rates[currency]
            ) } ${ currency }`
          );
        }
      );

      const row =
        document.createElement("div");

      row.textContent =
        parts.join(" = ");

      ratesElement.appendChild(row);
    }


    function convert (sourceCurrency) {
      if (!rates[sourceCurrency]) {
        return;
      }

      const sourceValue =
        parseFloat(
          inputs[sourceCurrency].value
        );

      if (Number.isNaN(sourceValue)) {
        currencies.forEach(currency => {
          if (currency !== sourceCurrency) {
            inputs[currency].value = "";
          }
        });

        return;
      }

      const valueInBaseCurrency =
        sourceValue /
        rates[sourceCurrency];

      currencies.forEach(currency => {
        if (currency === sourceCurrency) {
          return;
        }

        if (!rates[currency]) {
          return;
        }

        inputs[currency].value =
          formatAmount(
            valueInBaseCurrency *
            rates[currency]
          );
      });
    }


    function attachInputListeners () {
      currencies.forEach(currency => {
        inputs[currency].addEventListener(
          "input",
          () => convert(currency)
        );
      });
    }


    function saveRatesToCache (
      rateData
    ) {
      localStorage.setItem(
        RATE_CACHE_KEY,
        JSON.stringify({
          savedAt:
            new Date().toISOString(),

          data:
            rateData
        })
      );
    }


    function loadRatesFromCache () {
      const cached =
        localStorage.getItem(
          RATE_CACHE_KEY
        );

      if (!cached) {
        return null;
      }

      try {
        return JSON.parse(cached);
      } catch {
        return null;
      }
    }


    function saveNamesToCache () {
      localStorage.setItem(
        NAME_CACHE_KEY,
        JSON.stringify(
          currencyNames
        )
      );
    }


    function loadNamesFromCache () {
      const cached =
        localStorage.getItem(
          NAME_CACHE_KEY
        );

      if (!cached) {
        return false;
      }

      try {
        Object.assign(
          currencyNames,
          JSON.parse(cached)
        );

        return true;
      } catch {
        return false;
      }
    }


    async function loadCurrencyNames () {
      const response =
        await fetch(
          "https://api.frankfurter.dev/v2/currencies"
        );

      if (!response.ok) {
        throw new Error(
          `Currencies HTTP ${ response.status }`
        );
      }

      const data =
        await response.json();

      data.forEach(currency => {
        currencyNames[
          currency.iso_code
        ] = currency.name;
      });

      saveNamesToCache();
    }


    async function loadExchangeRates () {
      const quotes =
        config.convertedCurrencies.join(",");

      const url =
        "https://api.frankfurter.dev/v2/rates" +
        `?base=${ config.baseCurrency }` +
        `&quotes=${ quotes }`;

      const response =
        await fetch(url);

      if (!response.ok) {
        throw new Error(
          `Rates HTTP ${ response.status }`
        );
      }

      const data =
        await response.json();

      data.forEach(item => {
        rates[item.quote] =
          item.rate;
      });

      saveRatesToCache(data);

      return data;
    }


    function applyCachedRates (
      cached
    ) {
      if (
        !cached ||
        !Array.isArray(cached.data)
      ) {
        return false;
      }

      cached.data.forEach(item => {
        rates[item.quote] =
          item.rate;
      });

      return true;
    }


    function getRateDate (
      rateData
    ) {
      return rateData?.[0]?.date;
    }


    function showOnlineStatus (
      rateData
    ) {
      const rateDate =
        getRateDate(rateData);

      statusElement.classList.remove(
        "error"
      );

      statusElement.textContent =
        rateDate
          ? `Reference rates for ${ rateDate }`
          : "Latest reference rates";
    }


    function showOfflineStatus (
      cached
    ) {
      statusElement.classList.remove(
        "error"
      );

      const rateDate =
        cached?.data?.[0]?.date;

      statusElement.textContent =
        rateDate
          ? `Offline · cached rates from ${ rateDate }`
          : "Offline · using cached rates";
    }


    async function refreshData () {
      try {
        const [
          ,
          rateData
        ] = await Promise.all([
          loadCurrencyNames(),
          loadExchangeRates()
        ]);

        renderCurrencyCards();

        attachInputListeners();

        convert(
          config.baseCurrency
        );

        renderRateSummary();

        showOnlineStatus(
          rateData
        );

      } catch (error) {
        console.error(error);

        const cachedRates =
          loadRatesFromCache();

        const hasCachedRates =
          applyCachedRates(
            cachedRates
          );

        loadNamesFromCache();

        renderCurrencyCards();

        attachInputListeners();

        if (hasCachedRates) {
          convert(
            config.baseCurrency
          );

          renderRateSummary();

          showOfflineStatus(
            cachedRates
          );
        } else {
          statusElement.classList.add(
            "error"
          );

          statusElement.textContent =
            "Unable to load exchange rates.";
        }
      }
    }


    async function initialise () {
      renderTitle();

      loadNamesFromCache();

      const cachedRates =
        loadRatesFromCache();

      if (
        applyCachedRates(
          cachedRates
        )
      ) {
        renderCurrencyCards();

        attachInputListeners();

        convert(
          config.baseCurrency
        );

        renderRateSummary();

        showOfflineStatus(
          cachedRates
        );
      }

      await refreshData();
    }


    window.addEventListener(
      "online",
      () => {
        refreshData();
      }
    );


    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register(
        "./service-worker.js"
      );
    }


    initialise();
  </script>
</body>

</html>
